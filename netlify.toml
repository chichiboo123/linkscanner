# Netlify 배포 설정
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA 라우팅: 모든 경로를 index.html로
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 함수 설정
# 스크린샷은 외부 렌더링 API(Microlink)로 처리하므로 함수는 가벼운 HTTP 호출만 수행한다.
[functions]
  node_bundler = "esbuild"

[functions."scan"]
  # 외부 렌더링 + Gemini 분석을 고려한 여유 타임아웃 (플랜에 따라 상한 상이)
  timeout = 26
